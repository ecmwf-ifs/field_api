name: build

# Controls when the action will run
on:

  # Trigger the workflow on all pushes, except on tag creation
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'

  # Trigger the workflow on all pull requests
  pull_request: ~

  # Allow workflow to be dispatched on demand
  workflow_dispatch: ~

env:
  FIELD_API_TOOLS: ${{ github.workspace }}/.github/tools
  CTEST_PARALLEL_LEVEL: 1
  CACHE_SUFFIX: v0         # Increase to force new cache to be created
  DEV_ALLOC_SIZE: 1000000

jobs:
  ci:
    name: ci

    strategy:
      fail-fast: false  # false: try to complete all jobs

      matrix:
        build_type: [Debug,RelWithDebInfo]
        name:
          - linux gnu-14
          - linux nvhpc-24.5
          - linux nvhpc-25.9
          - linux intel-classic
          - linux intel-modern
          - macos gnu
          - linux flang-22
        get_view_abort: [ON,OFF]
        delayed: [ON,OFF]

        include:

          - name: linux gnu-14
            os: ubuntu-24.04
            compiler: gnu-14
            compiler_cc: gcc-14
            compiler_cxx: g++-14
            compiler_fc: gfortran-14
            python-version: '3.11'
            caching: true

          - name: linux nvhpc-24.5
            os: ubuntu-24.04
            compiler: nvhpc-24.5
            compiler_version: '24.5'
            compiler_cc: nvc
            compiler_cxx: nvc++
            compiler_fc: nvfortran
            python-version: '3.11'
            caching: true

          - name: linux nvhpc-25.9
            os: ubuntu-24.04
            compiler: nvhpc-25.9
            compiler_version: '25.9'
            compiler_cc: nvc
            compiler_cxx: nvc++
            compiler_fc: nvfortran
            python-version: '3.11'
            caching: true

          - name : linux intel-classic
            os: ubuntu-22.04
            compiler: intel-classic
            compiler_cc: icc
            compiler_cxx: icpc
            compiler_fc: ifort
            python-version: '3.11'
            caching: true

          - name : linux intel-modern
            os: ubuntu-24.04
            compiler: intel-modern
            compiler_cc: icx
            compiler_cxx: icpx
            compiler_fc: ifx
            python-version: '3.11'
            caching: true

          - name: macos gnu
            # Xcode compiler requires empty environment variables, so we pass null (~) here
            os: macos-15
            compiler: clang-17
            compiler_cc: ~
            compiler_cxx: ~
            compiler_fc: gfortran-15
            python-version: '3.11'
            caching: true

          - name: linux flang-22
            os: ubuntu-24.04
            compiler: flang-22
            compiler_cc: clang-22
            compiler_cxx: clang++-22
            compiler_fc: flang-22
            python-version: '3.11'
            caching: true
            openmpi_version: '5.0.7'
            cmake_options: "-DBUILD_SHARED_LIBS=OFF -DENABLE_IO_PARALLEL=OFF -DMPI_SLOTS=4 -DMPI_ARGS=--oversubscribe"

    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Environment
      run:  |
        echo "DEPS_DIR=${{ runner.temp }}/deps" >> $GITHUB_ENV
        echo "CC=${{ matrix.compiler_cc }}"     >> $GITHUB_ENV
        echo "CXX=${{ matrix.compiler_cxx }}"   >> $GITHUB_ENV
        echo "FC=${{ matrix.compiler_fc }}"     >> $GITHUB_ENV

        if [[ "${{ matrix.os }}" =~ macos ]]; then
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export SDKROOT=$(xcrun --show-sdk-path)
          echo "HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1"                >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1"            >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --show-sdk-path)"         >> $GITHUB_ENV
          brew install libomp
          brew install open-mpi
          brew install coreutils
          brew install hdf5
        else
          sudo apt-get update
          if [[ "${{ matrix.compiler }}" =~ gnu ]]; then
             sudo apt-get install libopenmpi-dev
             sudo apt-get install libhdf5-dev libhdf5-serial-dev
          else
              export HDF5_ROOT=${GITHUB_WORKSPACE}/hdf5-install
          fi
        fi

        printenv

    - name: Install flang compiler
      if: contains( matrix.compiler, 'flang' )
      shell: bash -eux {0}
      run: |
        sudo apt-get install -y wget gpg software-properties-common ninja-build
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
        echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y clang-22 flang-22 libomp-22-dev
        echo "CACHE_SUFFIX=${CACHE_SUFFIX}-llvm_flang_22-mpi_${{ matrix.openmpi_version }}" >> $GITHUB_ENV

    - name: Cache Dependencies
      # There seems to be a problem with cached NVHPC dependencies, leading to SIGILL perhaps due to slightly different architectures
      if: matrix.caching
      id: deps-cache
      uses: pat-s/always-upload-cache@v2.1.5
      with:
        path: ${{ env.DEPS_DIR }}
        key: deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ env.CACHE_SUFFIX }}

    # Free up disk space for nvhpc
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      if: contains( matrix.compiler, 'nvhpc' )
      continue-on-error: true
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install NVHPC compiler
      if: contains( matrix.compiler, 'nvhpc' )
      shell: bash -eux {0}
      run: |
        ${FIELD_API_TOOLS}/install-nvhpc.sh --prefix /opt/nvhpc --version ${{matrix.compiler_version}}
        source /opt/nvhpc/env.sh
        FC=pgf90 .github/tools/install-hdf5.sh
        echo "HDF5_ROOT=${GITHUB_WORKSPACE}/hdf5-install"    >> $GITHUB_ENV
        echo "${NVHPC_DIR}/compilers/bin"                    >> $GITHUB_PATH
        if [ "${{matrix.compiler_version}}" = "24.5" ]; then
          echo "${NVHPC_DIR}/comm_libs/openmpi4/bin" >> $GITHUB_PATH
        elif [ "${{matrix.compiler_version}}" = "25.9" ]; then
          echo "${NVHPC_DIR}/comm_libs/hpcx/bin" >> $GITHUB_PATH
        else 
          echo "Wrong NVHPC compiler version. Please edit script"
        fi

        # Force UCX (and thus OpenMPI's UCX PML) onto TCP + shared-memory transports.
        # The GitHub-hosted Azure runners intermittently expose a MANA (mana_0) RDMA/
        # InfiniBand device on which UCX fails to create UD queue-pairs, causing
        # MPI_Init to abort ("failed to create UD QP ... Operation not supported").
        # These are single-node tests that never need RDMA, so restrict transports to
        # loopback TCP + shared memory to make MPI startup deterministic.
        echo "UCX_TLS=tcp,self,sm" >> $GITHUB_ENV
        echo "UCX_NET_DEVICES=lo"  >> $GITHUB_ENV
        echo "UCX_LOG_LEVEL=error" >> $GITHUB_ENV

    - name: Download Intel compiler
      if: contains( matrix.compiler, 'intel' )
      run: |
        wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        rm GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"

    - name: Install Intel classic compiler
      if: contains( matrix.compiler, 'intel-classic' )
      run: |
        sudo apt update
        sudo apt install \
          intel-oneapi-compiler-fortran-2023.2.4 \
          intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic-2023.2.4 \
          intel-oneapi-mpi-devel-2021.10.0 \
          intel-oneapi-mkl-2023.2.0
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        FC=ifort .github/tools/install-hdf5.sh --use-configure ON --version 1.14.3
        echo "HDF5_ROOT=${GITHUB_WORKSPACE}/hdf5-install"    >> $GITHUB_ENV
        echo "CACHE_SUFFIX=$CC-$($CC -dumpversion)" >> $GITHUB_ENV

    - name: Install Intel modern compiler
      if: contains( matrix.compiler, 'intel-modern' )
      run: |
        sudo apt update
        sudo apt install intel-oneapi-toolkit
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        .github/tools/install-hdf5.sh
        echo "HDF5_ROOT=${GITHUB_WORKSPACE}/hdf5-install"    >> $GITHUB_ENV
        echo "CACHE_SUFFIX=$CC-$($CC -dumpversion)" >> $GITHUB_ENV

    - name: Install OpenMPI for flang
      if: contains( matrix.compiler, 'flang' )
      shell: bash -eux {0}
      run: |
        # Fortran modules from Ubuntu's gfortran-built OpenMPI are not compatible with flang.
        MPI_PREFIX="${DEPS_DIR}/openmpi"
        if [[ ! -x "${MPI_PREFIX}/bin/mpifort" ]]; then
          MPI_VERSION="${{ matrix.openmpi_version }}"
          MPI_SOURCE="${RUNNER_TEMP}/openmpi-${MPI_VERSION}"
          mkdir -p "${MPI_SOURCE}"
          curl --fail --location "https://www.open-mpi.org/software/ompi/v${MPI_VERSION%.*}/downloads/openmpi-${MPI_VERSION}.tar.gz" | tar xz --strip-components=1 -C "${MPI_SOURCE}"
          cd "${MPI_SOURCE}"
          FCFLAGS=-fPIC CFLAGS=-fPIC FFLAGS=-fPIC ./configure --prefix="${MPI_PREFIX}"
          make -j4
          make install
        fi
        echo "MPI_HOME=${MPI_PREFIX}" >> $GITHUB_ENV
        echo "${MPI_PREFIX}/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=${MPI_PREFIX}/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

    - name: Build & Test
      id: build-test
      uses: ecmwf-actions/build-package@v2
      with:
        self_coverage: false
        force_build: true
        cache_suffix: "${{ matrix.build_type }}-${{ env.CACHE_SUFFIX }}"
        recreate_cache: ${{ matrix.caching == false }}
        dependencies: |
          ecmwf/ecbuild
          ecmwf-ifs/fiat
        dependency_branch: develop
        dependency_cmake_options: |
          ecmwf-ifs/fiat: "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -G Ninja -DENABLE_TESTS=OFF ${{ matrix.cmake_options}}"
        cmake_options: "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_options }} -G Ninja -DENABLE_ACC=OFF -DENABLE_MPI=ON -DENABLE_IO_PARALLEL=ON -DENABLE_GET_VIEW_ABORT=${{ matrix.get_view_abort }} -DENABLE_DELAYED=${{ matrix.delayed }} -DENABLE_GUARD_0_SIZE=${{ matrix.delayed }} ${{matrix.cmake_options}}"
        ctest_options: "${{ matrix.ctest_options }}"
